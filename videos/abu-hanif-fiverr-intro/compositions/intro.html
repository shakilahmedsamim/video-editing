      <script>
        (function () {
          const SFX = /*SFX*/[["swoosh","c[0]-0.1",0.5],["ding","c[0]+0.7",0.35],["pop","c[1]+0.1",0.45],["pop","c[1]+0.5",0.35],["pop","c[1]+0.7",0.35],["pop","c[1]+0.9",0.35],["pop","c[1]+1.1",0.35]]/*ENDSFX*/; // read by scripts/build.mjs
