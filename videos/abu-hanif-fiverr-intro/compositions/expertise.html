<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #ex-w, #ex-cam { position: absolute; inset: 0; }
        #ex-k { position: absolute; left: 140px; top: 110px; }
        #ex-h { position: absolute; left: 140px; top: 156px; width: 1640px; font-size: 76px; }
        #ex-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        #ex-hub { position: absolute; left: 820px; top: 520px; width: 280px; height: 140px; display: flex; flex-direction: column; align-items: center;
          justify-content: center; font-size: 30px; font-weight: 800; border-color: rgba(94,224,255,0.5); background: #0c1a33;
          box-shadow: 0 0 60px rgba(76,141,255,0.35), 0 30px 80px rgba(0,0,0,0.45); }
        #ex-hub small { font-size: 18px; color: var(--muted); font-weight: 600; margin-top: 4px; }
        .ex-n { position: absolute; width: 380px; height: 96px; margin-left: -190px; background: #0b1426; white-space: nowrap; margin-top: -48px; display: flex; align-items: center; gap: 14px;
          padding: 0 22px; font-size: 26px; font-weight: 700; }
        .ex-n i { width: 14px; height: 14px; border-radius: 7px; flex: none; }
      </style>

      <div id="root" data-composition-id="expertise" data-width="1920" data-height="1080">
        <div id="ex-w"><div id="ex-cam">
          <div id="ex-k" class="kick">What I build</div>
          <div id="ex-h" class="hd">Reliable tracking <span class="grad">&amp; performance systems</span></div>
          <svg id="ex-svg" viewBox="0 0 1920 1080"></svg>
          <div id="ex-hub" class="gl">Your data<small>one source of truth</small></div>
          <div id="ex-nodes"></div>
        </div></div>
      </div>

      <script>
        (function () {
          const SFX = /*SFX*/[["swoosh","c[0]+0.1",0.5],["pop","c[0]+0.9",0.5],
            ["tick","c[1]+0.1",0.5],["pop","c[1]+0.2",0.4],["tick","c[1]+0.6",0.5],["pop","c[1]+0.7",0.4],["tick","c[1]+1.1",0.5],["pop","c[1]+1.2",0.4],
            ["tick","c[2]+0.1",0.5],["pop","c[2]+0.2",0.4],["tick","c[2]+1.0",0.5],["pop","c[2]+1.1",0.4],["tick","c[2]+2.0",0.5],["pop","c[2]+2.1",0.4],["ding","c[2]+3.0",0.4]]/*ENDSFX*/; // read by scripts/build.mjs
          const K = /*CUES*/{"c":[0.9,3.416,6.759],"d":10.933,"w":0.6}/*END*/;
          const c = K.c, D = K.d;
          const tl = gsap.timeline({ paused: true });
          if (K.w) tl.fromTo("#ex-w", { opacity: 0, scale: 1.04, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: K.w, ease: "power2.out" }, 0);
          tl.fromTo("#ex-cam", { scale: 1 }, { scale: 1.05, duration: D, ease: "none" }, 0);
          tl.fromTo("#ex-k", { opacity: 0 }, { opacity: 1, duration: 0.4 }, c[0] - 0.3);
          tl.fromTo("#ex-h", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, c[0]);
          tl.fromTo("#ex-hub", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, c[0] + 0.9);
          tl.to("#ex-hub", { boxShadow: "0 0 100px rgba(94,224,255,0.55), 0 30px 80px rgba(0,0,0,0.45)", duration: 1.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, c[0] + 1.6);
          const nodes = [
            ["Google Ads", "#4c8dff"], ["GTM", "#34d399"], ["GA4", "#fbbf24"],
            ["Enhanced Conversions", "#5ee0ff"], ["Server-side tracking", "#a78bfa"], ["Meta CAPI", "#f472b6"]];
          const pos = [[420, 400], [960, 360], [1500, 400], [420, 820], [960, 860], [1500, 820]];
          const at = [c[1] + 0.1, c[1] + 0.6, c[1] + 1.1, c[2] + 0.1, c[2] + 1.0, c[2] + 2.0];
          const svg = document.getElementById("ex-svg"), host = document.getElementById("ex-nodes");
          const NS = "http://www.w3.org/2000/svg";
          nodes.forEach(([label, col], i) => {
            const [x, y] = pos[i];
            const ln = document.createElementNS(NS, "line");
            ln.setAttribute("x1", 960); ln.setAttribute("y1", 590); ln.setAttribute("x2", x); ln.setAttribute("y2", y);
            ln.setAttribute("stroke", col); ln.setAttribute("stroke-width", "3"); ln.setAttribute("stroke-opacity", "0.7");
            const len = Math.hypot(x - 960, y - 590);
            ln.setAttribute("stroke-dasharray", len); ln.setAttribute("stroke-dashoffset", len);
            svg.appendChild(ln);
            const n = document.createElement("div"); n.className = "gl ex-n"; n.style.left = x + "px"; n.style.top = y + "px";
            n.innerHTML = `<i style="background:${col};box-shadow:0 0 12px ${col}"></i>${label}`; host.appendChild(n);
            tl.to(ln, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.out" }, at[i]);
            tl.fromTo(n, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, at[i] + 0.15);
            // data pulses flowing from node to hub
            for (let k = 0; k < 3; k++) {
              const p = document.createElementNS(NS, "circle"); p.setAttribute("r", "6"); p.setAttribute("fill", "#ffffff");
              p.setAttribute("cx", x); p.setAttribute("cy", y); p.setAttribute("opacity", "0"); svg.appendChild(p);
              const t0 = at[i] + 0.7 + k * 0.9;
              if (t0 + 0.9 < D - 0.6) {
                tl.fromTo(p, { attr: { cx: x, cy: y, opacity: 0 } }, { attr: { cx: 960, cy: 590, opacity: 1 }, duration: 0.9, ease: "none" }, t0);
                tl.to(p, { attr: { opacity: 0 }, duration: 0.1 }, t0 + 0.9);
              }
            }
          });
          tl.to("#ex-w", { opacity: 0, scale: 0.98, filter: "blur(8px)", duration: 0.55, ease: "power2.in" }, D - 0.6);
          window.__timelines["expertise"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
