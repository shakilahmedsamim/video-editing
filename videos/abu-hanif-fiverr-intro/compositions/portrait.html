<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        #po { position: absolute; left: 1150px; top: 200px; width: 720px; height: 720px; }
        #po-glow { position: absolute; left: -110px; top: -110px; width: 940px; height: 940px; border-radius: 50%;
          background: radial-gradient(circle, rgba(76,141,255,0.30), rgba(76,141,255,0.07) 45%, transparent 68%); }
        #po-ring { position: absolute; left: 70px; top: 40px; width: 580px; height: 580px; border-radius: 50%;
          border: 2px solid rgba(94,224,255,0.45); box-shadow: 0 0 60px rgba(76,141,255,0.35), inset 0 0 60px rgba(76,141,255,0.2); }
        #po-ring2 { position: absolute; left: 30px; top: 0; width: 660px; height: 660px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.16); }
        #po-arc { position: absolute; left: 30px; top: 0; width: 660px; height: 660px; border-radius: 50%;
          border: 3px solid transparent; border-top-color: var(--cyan); border-right-color: rgba(94,224,255,0.3); }
        #po-ph { position: absolute; left: 0; top: 30px; width: 720px; height: 686px;
          -webkit-mask-image: linear-gradient(180deg, #000 62%, transparent 96%), linear-gradient(90deg, transparent 2%, #000 16%, #000 84%, transparent 98%);
          -webkit-mask-composite: source-in;
          mask-image: linear-gradient(180deg, #000 62%, transparent 96%), linear-gradient(90deg, transparent 2%, #000 16%, #000 84%, transparent 98%);
          mask-composite: intersect; }
        #po-ph img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 30px rgba(76,141,255,0.35)); }
        #po-tag { position: absolute; left: 50%; top: 650px; white-space: nowrap; padding: 12px 24px; border-radius: 999px;
          font-size: 22px; font-weight: 700; background: rgba(11,20,38,0.9); border: 1px solid rgba(255,255,255,0.14); }
        #po-tag i { display: inline-block; width: 10px; height: 10px; border-radius: 5px; background: var(--ok); margin-right: 10px; box-shadow: 0 0 10px var(--ok); }
      </style>

      <div id="root" data-composition-id="portrait" data-width="1920" data-height="1080">
        <div id="po">
          <div id="po-glow"></div>
          <div id="po-ring2"></div>
          <div id="po-arc"></div>
          <div id="po-ring"></div>
          <div id="po-ph"><img src="assets/img/abu-hanif-cutout.png" alt="Abu Hanif"></div>
          <div id="po-tag"><i></i>Abu Hanif</div>
        </div>
      </div>

      <script>
        (function () {
          // scene start times (hook, problem, intro, expertise, proof, outcome, cta), injected by scripts/build.mjs
          const S = /*SCENES*/[0,3.696,11.75,16.834,27.167,35.547,42.094]/*ENDSCENES*/;
          const T = /*TOTAL*/50.001/*ENDTOTAL*/;
          const tl = gsap.timeline({ paused: true });
          // entrance
          tl.fromTo("#po-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0.1);
          tl.fromTo("#po-ring", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 0.2);
          tl.fromTo("#po-ph", { opacity: 0, y: 80, filter: "blur(16px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out" }, 0.3);
          tl.fromTo("#po-tag", { opacity: 0, y: 20, xPercent: -50 }, { opacity: 1, y: 0, xPercent: -50, duration: 0.5, ease: "power3.out" }, 1.0);
          // always-on motion: slow rings, gentle float, breathing glow
          tl.fromTo("#po-ring2", { rotation: 0 }, { rotation: 120, duration: T, ease: "none" }, 0);
          tl.fromTo("#po-arc", { rotation: 0, opacity: 0 }, { rotation: 1080, opacity: 1, duration: T, ease: "none" }, 0);
          tl.to("#po-ph", { y: -14, duration: 3, yoyo: true, repeat: Math.floor((T - 1.4) / 3) - 1, ease: "sine.inOut" }, 1.4);
          tl.to("#po-glow", { scale: 1.08, opacity: 0.75, duration: 2.5, yoyo: true, repeat: Math.floor(T / 2.5) - 1, ease: "sine.inOut" }, 1.4);
          // a soft pulse of the ring on every scene change
          S.slice(1).forEach((t) => {
            tl.to("#po-ring", { scale: 1.06, borderColor: "rgba(94,224,255,0.9)", duration: 0.3, ease: "power2.out" }, t - 0.3);
            tl.to("#po-ring", { scale: 1, borderColor: "rgba(94,224,255,0.45)", duration: 0.6, ease: "power2.inOut" }, t);
          });
          // spotlight during the name reveal and the call to action
          tl.to("#po", { scale: 1.06, duration: 0.8, ease: "power3.inOut", transformOrigin: "50% 60%" }, S[2] - 0.3);
          tl.to("#po", { scale: 1, duration: 0.8, ease: "power3.inOut" }, S[3] - 0.4);
          tl.to("#po", { scale: 1.06, duration: 0.8, ease: "power3.inOut" }, S[6] - 0.2);
          window.__timelines["portrait"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
