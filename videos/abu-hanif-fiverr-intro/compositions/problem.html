<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #pb-w, #pb-cam { position: absolute; inset: 0; }
        #pb-k { position: absolute; left: 140px; top: 130px; }
        #pb-h { position: absolute; left: 140px; top: 180px; width: 940px; font-size: 80px; }
        #pb-h span { color: var(--warn); }
        .pb-n { position: absolute; top: 520px; width: 150px; height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center;
          font-size: 26px; font-weight: 800; }
        .pb-n small { font-size: 16px; color: var(--muted); font-weight: 600; margin-top: 6px; }
        .pb-l { position: absolute; top: 583px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); transform-origin: left center; }
        .pb-fix { position: absolute; top: 583px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--blue), var(--cyan));
          box-shadow: 0 0 16px rgba(94,224,255,0.6); transform-origin: left center; }
        .pb-b { position: absolute; top: 534px; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
          font-size: 24px; font-weight: 900; }
        .pb-x { background: var(--bad); color: #fff; box-shadow: 0 0 0 8px rgba(242,85,90,0.2); }
        .pb-ok { background: var(--ok); color: #04261a; }
        .pb-dot { position: absolute; top: 578px; width: 14px; height: 14px; border-radius: 7px; background: #fff; box-shadow: 0 0 14px var(--cyan); }
        #pb-st { position: absolute; left: 140px; width: 940px; top: 720px; text-align: center; font-size: 30px; font-weight: 700; }
        #pb-s1 { color: var(--bad); } #pb-s2 { color: var(--ok); }
      </style>

      <div id="root" data-composition-id="problem" data-width="1920" data-height="1080">
        <div id="pb-w"><div id="pb-cam">
          <div id="pb-k" class="kick">The real problem</div>
          <div id="pb-h" class="hd">The problem is often <span>your tracking.</span></div>
          <div id="pb-lines"></div>
          <div class="gl pb-n" style="left:140px">Ads<small>clicks</small></div>
          <div class="gl pb-n" style="left:337px">Website<small>visits</small></div>
          <div class="gl pb-n" style="left:535px">GTM<small>tags</small></div>
          <div class="gl pb-n" style="left:732px">GA4<small>events</small></div>
          <div class="gl pb-n" style="left:930px">CRM<small>leads</small></div>
          <div id="pb-st"><span id="pb-s1">Disconnected signals</span></div>
          <div id="pb-st2" style="position:absolute;left:140px;width:940px;top:720px;text-align:center;font-size:30px;font-weight:700;"><span id="pb-s2">One connected system</span></div>
        </div></div>
      </div>

      <script>
        (function () {
          const SFX = /*SFX*/[["pop","c[0]+0.7",0.4],["pop","c[0]+0.85",0.4],["pop","c[0]+1.0",0.4],["pop","c[0]+1.15",0.4],["pop","c[0]+1.3",0.4],
            ["thud","c[1]+0.4",0.5],["thud","c[1]+0.7",0.5],["swoosh","c[1]+2.9",0.6],["tick","c[1]+3.1",0.6],["tick","c[1]+3.3",0.6],["tick","c[1]+3.5",0.6],["tick","c[1]+3.7",0.6],["ding","c[1]+4.0",0.5]]/*ENDSFX*/; // read by scripts/build.mjs
          const K = /*CUES*/{"c":[0.9,3.227],"d":8.653,"w":0.6}/*END*/;
          const c = K.c, D = K.d;
          const tl = gsap.timeline({ paused: true });
          if (K.w) tl.fromTo("#pb-w", { opacity: 0, scale: 1.04, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: K.w, ease: "power2.out" }, 0);
          tl.fromTo("#pb-cam", { scale: 1 }, { scale: 1.05, duration: D, ease: "none" }, 0);
          tl.fromTo("#pb-k", { opacity: 0 }, { opacity: 1, duration: 0.4 }, c[0] - 0.3);
          tl.fromTo("#pb-h", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, c[0]);
          tl.fromTo(".pb-n", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, stagger: 0.15, ease: "back.out(1.6)" }, c[0] + 0.7);
          // links between nodes (x of each gap)
          const host = document.getElementById("pb-lines");
          const gaps = [[290, 337], [487, 535], [685, 732], [882, 930]];
          const bad = [1, 3];
          gaps.forEach(([a, b], i) => {
            const l = document.createElement("div"); l.className = "pb-l"; l.style.left = a + "px"; l.style.width = (b - a) + "px"; host.appendChild(l);
            const f = document.createElement("div"); f.className = "pb-fix"; f.style.left = a + "px"; f.style.width = (b - a) + "px"; host.appendChild(f);
            tl.fromTo(l, { scaleX: 0 }, { scaleX: 1, duration: 0.3 }, c[0] + 1.3 + i * 0.12);
            tl.fromTo(f, { scaleX: 0 }, { scaleX: 1, duration: 0.25 }, c[1] + 3.0 + i * 0.2);
            if (bad.includes(i)) {
              const x = document.createElement("div"); x.className = "pb-b pb-x"; x.textContent = "!"; x.style.left = ((a + b) / 2 - 22) + "px"; host.appendChild(x);
              const o = document.createElement("div"); o.className = "pb-b pb-ok"; o.innerHTML = "&#10003;"; o.style.left = ((a + b) / 2 - 22) + "px"; host.appendChild(o);
              tl.fromTo(x, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, c[1] + 0.4 + (i === 3 ? 0.3 : 0));
              tl.to(x, { scale: 1.15, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, c[1] + 0.8);
              tl.to(x, { scale: 0, duration: 0.2 }, c[1] + 2.9);
              tl.fromTo(o, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, c[1] + 3.1 + i * 0.2);
            }
          });
          // data pulses once the system is connected
          for (let i = 0; i < 6; i++) {
            const d = document.createElement("div"); d.className = "pb-dot"; host.appendChild(d);
            tl.fromTo(d, { x: 200, opacity: 0 }, { x: 1010, opacity: 1, duration: 1.6, ease: "none" }, c[1] + 3.6 + i * 0.3);
            tl.to(d, { opacity: 0, duration: 0.2 }, c[1] + 5.4 + i * 0.3);
          }
          tl.fromTo("#pb-st", { opacity: 0 }, { opacity: 1, duration: 0.4 }, c[1] + 0.6);
          tl.to("#pb-st", { opacity: 0, y: -10, duration: 0.3 }, c[1] + 2.9);
          tl.fromTo("#pb-st2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, c[1] + 3.6);
          tl.to("#pb-w", { opacity: 0, scale: 0.98, filter: "blur(8px)", duration: 0.55, ease: "power2.in" }, D - 0.6);
          window.__timelines["problem"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
