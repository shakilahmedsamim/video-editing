<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #pr-wrap { position: absolute; inset: 0; }
        #pr-head { position: absolute; left: 140px; top: 70px; }
        #pr-h { margin-top: 10px; font-size: 54px; font-weight: 800; letter-spacing: -0.03em; }
        #pr-tag { position: absolute; right: 140px; top: 84px; }
        #pr-grid { position: absolute; left: 140px; right: 140px; top: 220px; display: grid;
          grid-template-columns: 1fr 1fr; grid-template-rows: 320px 320px; gap: 32px; }
        .pr-card { position: relative; padding: 30px 36px; overflow: hidden; }
        .pr-n { font-size: 20px; color: var(--blue); font-weight: 700; letter-spacing: 0.12em; }
        .pr-t { margin-top: 8px; font-size: 32px; font-weight: 700; }
        .pr-vis { position: absolute; left: 36px; right: 36px; top: 130px; bottom: 30px; }
        /* 1 checkout boundary */
        .bx { position: absolute; top: 20px; height: 120px; width: 280px; border: 1px dashed var(--line); border-radius: 14px;
          font-size: 22px; color: var(--muted); padding: 14px 18px; }
        #pr1-a { left: 0; } #pr1-b { right: 0; }
        #pr1-wall { position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: var(--warn); border-radius: 3px; }
        #pr1-tok { position: absolute; left: 20px; top: 74px; font-size: 20px; padding: 6px 12px; border-radius: 8px;
          background: var(--blue-soft); color: #9cc0ff; }
        /* 2 duplicate */
        .ev { height: 52px; margin-bottom: 12px; border-radius: 10px; background: var(--panel2); display: flex; align-items: center;
          padding: 0 18px; font-size: 21px; gap: 18px; }
        .ev b { color: #9cc0ff; font-weight: 600; }
        .ev .flag { margin-left: auto; font-family: Inter, sans-serif; font-weight: 700; font-size: 18px; color: var(--warn); }
        #pr2-e2 { border: 1px solid var(--warn); }
        /* 3 order qualification */
        #pr3-line { position: absolute; left: 20px; right: 20px; top: 60px; height: 3px; background: var(--line); }
        .tk { position: absolute; top: 46px; width: 30px; height: 30px; border-radius: 15px; background: var(--panel2); border: 3px solid var(--muted); }
        .tl-l { position: absolute; top: 96px; width: 220px; margin-left: -95px; text-align: center; font-size: 20px; color: var(--muted); }
        #pr3-k1 { left: 40px; } #pr3-l1 { left: 55px; }
        #pr3-k2 { left: 300px; border-color: var(--bad); background: var(--bad); } #pr3-l2 { left: 315px; color: var(--bad); font-weight: 700; }
        #pr3-k3 { left: 560px; } #pr3-l3 { left: 575px; }
        /* 4 lead fields */
        .fld { position: absolute; left: 0; width: 250px; height: 38px; border-radius: 8px; background: var(--panel2); font-size: 18px;
          display: flex; align-items: center; padding: 0 14px; color: var(--muted); }
        .crm { position: absolute; right: 0; width: 290px; height: 38px; border-radius: 8px; border: 1px solid var(--line); font-size: 18px;
          display: flex; align-items: center; padding: 0 14px; }
        .crm em { margin-left: auto; font-style: normal; color: var(--ok); font-weight: 700; }
        .crm.lost em { color: var(--bad); }
        #pr4-arrow { position: absolute; left: 290px; top: 72px; width: 0; height: 0; border-top: 14px solid transparent;
          border-bottom: 14px solid transparent; border-left: 22px solid var(--blue); }
        #pr-stamp { position: absolute; left: 50%; top: 520px; width: 760px; margin-left: -380px; height: 110px; border-radius: 55px;
          background: var(--blue); color: #fff; font-size: 40px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
      </style>

      <div id="root" data-composition-id="problems" data-width="1920" data-height="1080">
        <div id="pr-wrap">
          <div id="pr-head">
            <div class="eyebrow">Hard problems</div>
            <div id="pr-h">More than adding a tag</div>
          </div>
          <div id="pr-tag" class="demo-tag">SYNTHETIC EXAMPLES</div>
          <div id="pr-grid">
            <div id="pr-c1" class="card pr-card">
              <div class="pr-n">01</div><div class="pr-t">Checkout boundary</div>
              <div class="pr-vis">
                <div id="pr1-a" class="bx">Store pages</div>
                <div id="pr1-b" class="bx">Checkout</div>
                <div id="pr1-wall"></div>
                <div id="pr1-tok" class="mono">gclid=DEMO123</div>
              </div>
            </div>
            <div id="pr-c2" class="card pr-card">
              <div class="pr-n">02</div><div class="pr-t">Duplicate purchase event</div>
              <div class="pr-vis mono">
                <div id="pr2-e1" class="ev"><b>purchase</b> order_id: TEST-1042</div>
                <div id="pr2-e2" class="ev"><b>purchase</b> order_id: TEST-1042<span class="flag">fired twice</span></div>
              </div>
            </div>
            <div id="pr-c3" class="card pr-card">
              <div class="pr-n">03</div><div class="pr-t">Server event sent too early</div>
              <div class="pr-vis">
                <div id="pr3-line"></div>
                <div id="pr3-k1" class="tk"></div><div id="pr3-l1" class="tl-l">order created</div>
                <div id="pr3-k2" class="tk"></div><div id="pr3-l2" class="tl-l">event sent</div>
                <div id="pr3-k3" class="tk"></div><div id="pr3-l3" class="tl-l">order qualifies</div>
              </div>
            </div>
            <div id="pr-c4" class="card pr-card">
              <div class="pr-n">04</div><div class="pr-t">Lead fields lost before the CRM</div>
              <div class="pr-vis">
                <div class="fld" style="top:0">name</div>
                <div class="fld" style="top:46px">email</div>
                <div class="fld" style="top:92px">phone</div>
                <div class="fld" style="top:138px">city</div>
                <div id="pr4-arrow"></div>
                <div class="crm" style="top:0">name<em>ok</em></div>
                <div class="crm" style="top:46px">email<em>ok</em></div>
                <div id="pr4-x1" class="crm lost" style="top:92px">phone<em>empty</em></div>
                <div id="pr4-x2" class="crm lost" style="top:138px">city<em>empty</em></div>
              </div>
            </div>
          </div>
          <div id="pr-stamp">Each issue needs its own diagnosis</div>
        </div>
      </div>

      <script>
        (function () {
          const K = /*CUES*/{"c":[0.4,3.52,7.71,10.62,15.99,21.42],"d":25.189}/*END*/;
          const c = K.c, D = K.d;
          const tl = gsap.timeline({ paused: true });
          const card = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
          tl.fromTo("#pr-wrap", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#pr-head", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, c[0]);
          tl.fromTo("#pr-tag", { opacity: 0 }, { opacity: 1, duration: 0.4 }, c[0] + 0.4);
          // 1
          card("#pr-c1", c[1]);
          tl.fromTo("#pr1-tok", { x: 0 }, { x: 150, duration: 1.2, ease: "power2.out" }, c[1] + 0.6);
          tl.to("#pr1-tok", { opacity: 0.35, duration: 0.3 }, c[1] + 1.8);
          tl.fromTo("#pr1-wall", { scaleY: 0.2 }, { scaleY: 1, duration: 0.4 }, c[1] + 0.4);
          // 2
          card("#pr-c2", c[2]);
          tl.fromTo("#pr2-e1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35 }, c[2] + 0.5);
          tl.fromTo("#pr2-e2", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35 }, c[2] + 1.1);
          // 3
          card("#pr-c3", c[3]);
          tl.fromTo(["#pr3-k1", "#pr3-l1"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, c[3] + 0.5);
          tl.fromTo(["#pr3-k2", "#pr3-l2"], { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, c[3] + 1.6);
          tl.fromTo(["#pr3-k3", "#pr3-l3"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, c[3] + 2.6);
          // 4
          card("#pr-c4", c[4]);
          tl.fromTo(["#pr4-x1", "#pr4-x2"], { borderColor: "#24324d" }, { borderColor: "#f2555a", duration: 0.4, stagger: 0.2 }, c[4] + 1.5);
          // stamp
          tl.to("#pr-grid", { opacity: 0.25, duration: 0.5 }, c[5] - 0.1);
          tl.fromTo("#pr-stamp", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, c[5]);
          tl.to("#pr-wrap", { opacity: 0, duration: 0.4 }, D - 0.45);
          window.__timelines["problems"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
